# Keeps the free Supabase project from pausing (it pauses after 7 days without
# "sufficient activity") and keeps this scheduled workflow itself from being
# disabled by GitHub (scheduled workflows stop after 60 days without activity).
#
# A read every two days was NOT enough (the project was paused on 25.10 and
# 4.11.2026), so this now runs daily and performs a real database write via
# the keepalive() function from supabase/keepalive.sql, plus a read.
name: keepalive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPABASE_URL: https://kuzukuzitvcgrtrvheds.supabase.co
  SUPABASE_KEY: sb_publishable_PlS1iK_4nB92MFqswUl1ZA_nb0QSxfQ

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (write + read)
        run: |
          for i in 1 2 3; do
            write=$(curl -s -o /tmp/write.txt -w "%{http_code}" -X POST \
              "$SUPABASE_URL/rest/v1/rpc/keepalive" \
              -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
            read=$(curl -s -o /dev/null -w "%{http_code}" \
              "$SUPABASE_URL/rest/v1/bookings?select=id&limit=1" \
              -H "apikey: $SUPABASE_KEY")
            echo "write HTTP $write ($(cat /tmp/write.txt)) | read HTTP $read"
            if [ "$read" = "200" ]; then
              if [ "$write" != "200" ]; then
                echo "::warning::keepalive() write failed (HTTP $write). Run supabase/keepalive.sql in the Supabase SQL editor, otherwise the project may still get paused."
              fi
              exit 0
            fi
            sleep 20
          done
          echo "::error::Supabase did not answer. The project may be paused: open supabase.com/dashboard and press Restore on 'yochananuf'."
          exit 1

      - uses: actions/checkout@v4

      - name: Heartbeat commit every ~30 days
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 30 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .heartbeat
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git add .heartbeat
            git commit -m "heartbeat"
            git push
          fi
