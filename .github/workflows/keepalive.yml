# Keeps the free Supabase project from pausing (it pauses after 7 idle days)
# and keeps this scheduled workflow itself from being disabled by GitHub
# (scheduled workflows stop after 60 days without repository activity).
name: keepalive

on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://kuzukuzitvcgrtrvheds.supabase.co/rest/v1/bookings?select=id&limit=1" \
              -H "apikey: sb_publishable_PlS1iK_4nB92MFqswUl1ZA_nb0QSxfQ")
            echo "HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Supabase did not answer. The project may be paused: open supabase.com/dashboard and press Restore on 'yochananuf'."
          exit 1

      - uses: actions/checkout@v4

      - name: Heartbeat commit every ~30 days
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 30 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .heartbeat
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git add .heartbeat
            git commit -m "heartbeat"
            git push
          fi
